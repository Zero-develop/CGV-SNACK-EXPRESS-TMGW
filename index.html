<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Express FnB CGV TMGW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1e1e24;
      --accent: #ff0055;
      --text: #ffffff;
      --text-muted: #a0a0ab;
    }
    body {
      background-color: var(--bg-dark);
      background-image: linear-gradient(rgba(18, 18, 20, 0.7), rgba(18, 18, 20, 0.9));
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding-bottom: 100px;
      transition: background-image 0.25s ease, background-color 0.25s ease;
    }
    .navbar {
      background: rgba(30, 30, 36, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #2d2d38;
    }
    .menu-card {
      background: var(--card-bg);
      border: 1px solid #2d2d38;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .menu-card:hover { transform: translateY(-3px); }
    .menu-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(255, 0, 85, 0.3), 0 8px 18px rgba(255, 0, 85, 0.16);
    }
    .menu-img { height: 130px; object-fit: cover; }
    .btn-accent {
      background: var(--accent);
      color: white;
      border-radius: 10px;
      font-weight: 600;
    }
    .btn-accent:hover { background: #d60047; color: white; }
    .bottom-cart {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: rgba(255, 0, 85, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 12px 20px;
      box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
      z-index: 1000;
    }
    .modal-content { background: var(--card-bg); color: var(--text); border: 1px solid #2d2d38; }
    .form-control, .form-select {
      background: #121214;
      border: 1px solid #2d2d38;
      color: white;
    }
    .form-control:focus, .form-select:focus {
      background: #121214;
      color: white;
      border-color: var(--accent);
      box-shadow: none;
    }
    .cart-item-row {
      background: #121214;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .option-radio-btn {
      background: #121214;
      border: 1px solid #2d2d38;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .option-radio-btn:hover { border-color: var(--accent); }
    .form-check-input:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark sticky-top mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand fw-bold text-uppercase tracking-wider">
        <i class="fa-solid fa-film text-danger me-2"></i>CGV Snack Express
      </span>
    </div>
  </nav>

  <div class="container">
    <!-- Filter Kategori -->
    <div class="d-flex gap-2 overflow-auto mb-4 pb-2" id="categoryFilter">
      <button class="btn btn-sm btn-accent active" onclick="filterMenu('semua')">Semua</button>
    </div>

    <!-- Grid Menu -->
    <div class="row g-3" id="menuContainer">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="mt-2">Memuat Menu...</p>
      </div>
    </div>
  </div>

  <!-- Bar Keranjang Melayang -->
  <div class="bottom-cart d-none d-flex justify-content-between align-items-center" id="cartBar">
    <div>
      <small class="d-block text-white-50"><span id="totalItems">0</span> Item Pesanan</small>
      <span class="fw-bold fs-5" id="cartTotal">Rp 0</span>
    </div>
    <button class="btn btn-light rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#checkoutModal">
      Lihat Pesanan <i class="fa-solid fa-shopping-bag ms-1"></i>
    </button>
  </div>

  <!-- Modal Pilih Varian Multi-Group & Keterangan -->
  <div class="modal fade" id="optionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title fw-bold" id="optionModalTitle">Detail Menu</h5>
            <div class="text-danger fw-bold" id="optionModalPrice">Rp 0</div>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- Keterangan Produk -->
          <div class="p-2 mb-3 rounded" style="background: #121214; border-left: 3px solid var(--accent);">
            <small class="text-muted d-block fw-bold mb-1">Keterangan Produk:</small>
            <small class="text-white-50" id="optionModalDesc">-</small>
          </div>

          <!-- Form Opsi Varian Multi-Group -->
          <div id="optionList"></div>

          <button class="btn btn-accent w-100 mt-3 py-2 fw-bold" onclick="confirmOptionAddToCart()">
            + Tambahkan ke Pesanan
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Checkout & Edit Pesanan -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square text-danger me-2"></i>Detail & Edit Pesanan</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          
          <div class="mb-4">
            <h6 class="fw-bold text-muted mb-2">Daftar Menu Dipilih:</h6>
            <div id="cartItemList"></div>
          </div>

          <hr style="border-color: #2d2d38;">

          <form id="orderForm">
            <h6 class="fw-bold text-muted mb-3">Informasi Pemesan:</h6>
            <div class="mb-3">
              <label class="form-label">Nama Pemesan</label>
              <input type="text" class="form-control" id="nama" required placeholder="Contoh: Budi">
            </div>
            <div class="mb-3">
              <label class="form-label">Nomor WA Aktif</label>
              <input type="tel" class="form-control" id="wa" required placeholder="08xxxxxxxxxx">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Auditorium</label>
                <select class="form-select" id="auditorium" required>
                  <option value="" selected disabled>Pilih</option>
                  <option value="Auditorium 1">Auditorium 1</option>
                  <option value="Auditorium 2">Auditorium 2</option>
                  <option value="Auditorium 3">Auditorium 3</option>
                  <option value="Auditorium 4">Auditorium 4</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Nomor Kursi</label>
                <input type="text" class="form-control" id="kursi" required placeholder="Contoh: C12">
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Metode Pembayaran</label>
              <select class="form-select" id="metode" required onchange="toggleCashInput()">
                <option value="QRIS EDC">QRIS EDC</option>
                <option value="Debit">Debit</option>
                <option value="Kredit">Kredit</option>
                <option value="Cash">Cash (Tunai)</option>
              </select>
            </div>

            <div class="mb-3 d-none" id="cashGroup">
              <label class="form-label">Nominal Uang Cash (Rp)</label>
              <input type="number" class="form-control" id="nominalCash" placeholder="Masukkan jumlah uang" oninput="calculateChange()">
              <small class="text-info mt-1 d-block" id="changeText">Kembalian: Rp 0</small>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-2 mt-2" id="btnSubmit">
              Kirim Pesanan
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTuKqLh_DXuHKc-YC-AJBpQC6yzGFVCkGeWPUBjTfHXnAegAFaA9_fiI_f_xLvt40/exec";
    const ADMIN_WA = "628176881356"; // Ganti dengan nomor WA Kasir

    let menuData = [];
    let cart = {};
    let selectedMenuItem = null;

    async function loadMenu() {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getMenu`, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) throw new Error(`Network error: ${response.status}`);

        const data = await response.json();
        menuData = Array.isArray(data) ? data : [];

        if (!menuData.length) {
          throw new Error('Menu kosong');
        }

        renderCategories();
        renderMenu(menuData);
      } catch (err) {
        console.error('Gagal memuat menu:', err);
        document.getElementById('menuContainer').innerHTML = 
          `<div class="text-center text-danger">Gagal memuat menu. Cek URL Apps Script, nama sheet 'Menu', dan action=getMenu.</div>`;
      }
    }

    function renderCategories() {
      const categories = ['semua', ...new Set(menuData.map(item => item.kategori))];
      const filterContainer = document.getElementById('categoryFilter');
      filterContainer.innerHTML = categories.map(cat => 
        `<button class="btn btn-sm btn-outline-light text-capitalize px-3 rounded-pill" onclick="filterMenu('${cat}')">${cat}</button>`
      ).join('');
    }

    function filterMenu(kategori) {
      if (kategori === 'semua') renderMenu(menuData);
      else renderMenu(menuData.filter(i => i.kategori === kategori));
    }

    function renderMenu(items) {
      const container = document.getElementById('menuContainer');
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center text-muted">Belum ada menu yang tersedia.</div>`;
        return;
      }

      container.innerHTML = items.map((item) => {
        const actualIndex = menuData.findIndex(menuItem => menuItem === item);

        return `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card menu-card h-100" data-menu-index="${actualIndex >= 0 ? actualIndex : 0}" data-menu-name="${item.nama}">
              <img src="${item.gambar}" class="card-img-top menu-img" alt="${item.nama}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1585647347483-22b66260dfff?auto=format&fit=crop&w=300&q=80';">
              <div class="card-body p-2 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="card-title text-truncate mb-1 text-white fw-bold">${item.nama}</h6>
                  <p class="text-white-50 small mb-2 text-truncate">${item.keterangan || '-'}</p>
                  <p class="text-danger fw-bold small mb-2">Rp ${Number(item.harga).toLocaleString('id-ID')}</p>
                </div>
                <button class="btn btn-sm btn-accent w-100" onclick="handleAddToCartClick(${actualIndex >= 0 ? actualIndex : 0})">
                  + Tambah
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.menu-card').forEach((card) => {
        card.addEventListener('click', (event) => {
          if (event.target.closest('button')) return;
          const menuIndex = Number(card.dataset.menuIndex);
          const item = menuData[menuIndex];
          if (!item) return;
          selectedMenuItem = item;
          setMenuBackground(item);
          document.querySelectorAll('.menu-card').forEach((el) => el.classList.remove('active'));
          card.classList.add('active');
        });
      });
    }

    function setMenuBackground(item) {
      if (!item || !item.gambar) return;

      document.body.style.backgroundImage = `linear-gradient(rgba(18,18,20,0.58), rgba(18,18,20,0.88)), url('${item.gambar}')`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundAttachment = 'fixed';
    }

    function handleAddToCartClick(menuIndex) {
      const item = menuData[menuIndex];
      if (!item) return;

      selectedMenuItem = item;
      setMenuBackground(item);

      const selectedCard = document.querySelector(`.menu-card[data-menu-index="${menuIndex}"]`);
      if (selectedCard) {
        document.querySelectorAll('.menu-card').forEach((el) => el.classList.remove('active'));
        selectedCard.classList.add('active');
      }

      if (Array.isArray(item.optionGroups) && item.optionGroups.length > 0) {
        document.getElementById('optionModalTitle').innerText = item.nama;
        document.getElementById('optionModalPrice').innerText = `Rp ${item.harga.toLocaleString('id-ID')}`;
        document.getElementById('optionModalDesc').innerText = item.keterangan || 'Tidak ada deskripsi.';

        const optionList = document.getElementById('optionList');
        optionList.innerHTML = item.optionGroups.map((grp, gIdx) => `
          <div class="mb-3">
            <label class="form-label text-muted fw-bold small mb-1">${grp.groupName}:</label>
            ${grp.options.map((opt, oIdx) => {
              let extraPrice = 0;
              const match = opt.match(/\(\+(\d+)\)/);
              if (match) extraPrice = parseInt(match[1]);

              return `
                <label class="option-radio-btn" for="grp_${gIdx}_opt_${oIdx}">
                  <div>
                    <input class="form-check-input me-2" type="radio" name="group_${gIdx}" id="grp_${gIdx}_opt_${oIdx}" value="${opt}" ${oIdx === 0 ? 'checked' : ''}>
                    <span class="text-white small fw-bold">${opt.replace(/\(\+\d+\)/, '').trim()}</span>
                  </div>
                  <span class="text-danger small fw-bold">${extraPrice > 0 ? '+Rp ' + extraPrice.toLocaleString('id-ID') : 'Gratis'}</span>
                </label>
              `;
            }).join('')}
          </div>
        `).join('');

        const modal = new bootstrap.Modal(document.getElementById('optionModal'));
        modal.show();
        return;
      }

      addToCart(item.nama, item.harga);
    }

    function confirmOptionAddToCart() {
      if (!selectedMenuItem) return;

      let extraTotalPrice = 0;
      let selectedOptionTexts = [];

      if (Array.isArray(selectedMenuItem.optionGroups) && selectedMenuItem.optionGroups.length > 0) {
        selectedMenuItem.optionGroups.forEach((grp, gIdx) => {
          const selectedRadio = document.querySelector(`input[name="group_${gIdx}"]:checked`);
          if (selectedRadio) {
            const rawText = selectedRadio.value;
            const match = rawText.match(/\(\+(\d+)\)/);
            if (match) extraTotalPrice += parseInt(match[1]);

            const cleanText = rawText.replace(/\(\+\d+\)/, '').trim();
            selectedOptionTexts.push(`${grp.groupName}: ${cleanText}`);
          }
        });
      }

      let finalDisplayName = selectedMenuItem.nama;
      if (selectedOptionTexts.length > 0) {
        finalDisplayName += ` (${selectedOptionTexts.join(', ')})`;
      }

      const finalPrice = selectedMenuItem.harga + extraTotalPrice;
      addToCart(finalDisplayName, finalPrice);

      const modalEl = document.getElementById('optionModal');
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();
    }

    function addToCart(nama, harga) {
      if (cart[nama]) cart[nama].qty += 1;
      else cart[nama] = { harga, qty: 1 };
      updateCartUI();
    }

    function changeQty(nama, amount) {
      if (cart[nama]) {
        cart[nama].qty += amount;
        if (cart[nama].qty <= 0) delete cart[nama];
      }
      updateCartUI();
    }

    function updateCartUI() {
      let total = 0;
      let count = 0;
      let cartListHtml = '';

      for (let item in cart) {
        const subtotal = cart[item].harga * cart[item].qty;
        total += subtotal;
        count += cart[item].qty;

        cartListHtml += `
          <div class="cart-item-row d-flex justify-content-between align-items-center">
            <div>
              <div class="fw-bold text-white small">${item}</div>
              <div class="text-danger small fw-bold">Rp ${subtotal.toLocaleString('id-ID')}</div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-sm btn-outline-danger py-0 px-2 fw-bold" onclick="changeQty('${item}', -1)">-</button>
              <span class="fw-bold px-1">${cart[item].qty}</span>
              <button class="btn btn-sm btn-outline-success py-0 px-2 fw-bold" onclick="changeQty('${item}', 1)">+</button>
            </div>
          </div>
        `;
      }
      
      const cartBar = document.getElementById('cartBar');
      const cartItemList = document.getElementById('cartItemList');

      if (count > 0) {
        cartBar.classList.remove('d-none');
        document.getElementById('totalItems').innerText = count;
        document.getElementById('cartTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        cartItemList.innerHTML = cartListHtml;
      } else {
        cartBar.classList.add('d-none');
        cartItemList.innerHTML = `<div class="text-center text-muted small py-2">Keranjang kamu kosong.</div>`;
        
        const modalEl = document.getElementById('checkoutModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
      }
      calculateChange();
    }

    function toggleCashInput() {
      const metode = document.getElementById('metode').value;
      const cashGroup = document.getElementById('cashGroup');
      if (metode === 'Cash') cashGroup.classList.remove('d-none');
      else cashGroup.classList.add('d-none');
    }

    function getTotalPrice() {
      return Object.values(cart).reduce((sum, item) => sum + (item.harga * item.qty), 0);
    }

    function calculateChange() {
      const total = getTotalPrice();
      const cash = Number(document.getElementById('nominalCash').value) || 0;
      const change = cash - total;
      const changeText = document.getElementById('changeText');
      
      if (change >= 0) {
        changeText.className = "text-info mt-1 d-block";
        changeText.innerText = `Kembalian: Rp ${change.toLocaleString('id-ID')}`;
      } else {
        changeText.className = "text-danger mt-1 d-block";
        changeText.innerText = `Uang Kurang: Rp ${Math.abs(change).toLocaleString('id-ID')}`;
      }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      const total = getTotalPrice();
      const metode = document.getElementById('metode').value;
      const nominalCash = Number(document.getElementById('nominalCash').value) || 0;
      const kembalian = nominalCash - total;

      let pesananText = Object.keys(cart).map(k => `${k} x${cart[k].qty}`).join(', ');

      const payload = {
        action: 'saveOrder',
        nama: document.getElementById('nama').value,
        wa: document.getElementById('wa').value,
        auditorium: document.getElementById('auditorium').value,
        kursi: document.getElementById('kursi').value,
        pesanan: pesananText,
        total: total,
        metode: metode,
        nominalCash: metode === 'Cash' ? nominalCash : null,
        kembalian: metode === 'Cash' ? (kembalian >= 0 ? kembalian : 0) : null
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Gagal simpan ke Sheet", err);
      }

      let textWA = `*PESANAN FnB CINEMA*\n` +
        `----------------------------------\n` +
        `*Nama:* ${payload.nama}\n` +
        `*No. WA:* ${payload.wa}\n` +
        `*Lokasi:* ${payload.auditorium} - Kursi ${payload.kursi}\n` +
        `----------------------------------\n` +
        `*Detail Pesanan:*\n${Object.keys(cart).map(k => `- ${k} (x${cart[k].qty})`).join('\n')}\n` +
        `----------------------------------\n` +
        `*Total:* Rp ${total.toLocaleString('id-ID')}\n` +
        `*Metode Bayar:* ${payload.metode}\n`;

      if (metode === 'Cash') {
        textWA += `*Nominal Uang:* Rp ${nominalCash.toLocaleString('id-ID')}\n` +
                  `*Kembalian:* Rp ${(kembalian >= 0 ? kembalian : 0).toLocaleString('id-ID')}\n`;
      }

      window.location.href = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(textWA)}`;
    });

    loadMenu();
  </script>
</body>
</html>
